<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Design Ur Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="header-top">
            <p class="tagline">we design ur home</p>
        </div>
        <div class="header-content">
            <h1 class="company-name">COMPANY NAME</h1>
            <div class="header-right">
                <div class="placeholder">background image</div>
                <div class="contact-info">contact info</div>
            </div>
        </div>
    </header>

    <!-- Prompt Section -->
    <section class="prompt-section">
        <div class="prompt-content">
            <h2 class="prompt-title">AESTHETIC DECOR & TIMELESS SPACES</h2>
            <div class="prompt-line"></div>
        </div>
    </section>

    <!-- Content Body -->
    <main class="content-body">
        <!-- Row 1 -->
        <div class="content-row">
            <div class="content-block dark-brown">
                <p>description</p>
            </div>
            <div class="content-block cream image-block">
                <img src="https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=500&h=400&fit=crop" alt="Modern living room interior">
            </div>
        </div>

        <!-- Row 2 -->
        <div class="content-row">
            <div class="content-block light-grey image-block">
                <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=500&h=400&fit=crop" alt="Contemporary bedroom design">
            </div>
            <div class="content-block dark-brown">
                <p>description</p>
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <p class="footer-text">more informations</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
